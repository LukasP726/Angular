<app-create-thread></app-create-thread>

<ul class="list-group mt-4">
    <li *ngFor="let thread of threads"
     class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
    [routerLink]="['/threads/', thread.id]"
    >

      <div class="d-flex align-items-center">
        <i class="fas fa-stream me-2 text-primary"></i>
        <span class="text-primary"> {{thread.name}}</span>
      </div>


      <button class="btn btn-outline-danger btn-sm" 
              title="Remove thread"
              (click)="delete(thread); $event.stopPropagation()">>
        <i class="fa fa-trash"></i>
      </button>
    </li>
  </ul>
