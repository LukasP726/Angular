<div *ngIf="user" class="container mt-5">
  <div class="card shadow-lg rounded-4 p-4">
    <h2 class="text-center mb-4 text-primary">
      <i class="fa fa-user-circle me-2"></i>{{ user.firstName | uppercase }} {{ user.lastName | uppercase }}
    </h2>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">First Name:</label>
        <input class="form-control bg-light border-0" [value]="user.firstName" readonly>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Last Name:</label>
        <input class="form-control bg-light border-0" [value]="user.lastName" readonly>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Login:</label>
        <input class="form-control bg-light border-0" [value]="user.login" readonly>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Email:</label>
        <input class="form-control bg-light border-0" [value]="user.email" readonly type="email">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">Role:</label>
      <input class="form-control bg-light border-0" [value]="roleName" [placeholder]="roleName ? '' : 'Loading...'" readonly>
    </div>

    <div class="d-flex justify-content-between">
      <button type="button" class="btn btn-outline-secondary px-4" (click)="goBack()">
        <i class="fa fa-arrow-left me-2"></i>Go Back
      </button>
    </div>
  </div>
</div>
